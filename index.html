<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politics News</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="logo">📰</div>
        <div>
            <h1>Politics <span>News</span></h1>
            <p>Real News • Real People • Real India</p>
        </div>
    </div>

    <div class="top-icons">
        <button>⌕</button>
        <button>♧</button>
    </div>
</header>

<!-- Stories -->
<div class="stories">

    <div class="story">
        <div class="story-circle add">+</div>
        <span>Your Story</span>
    </div>

    <div class="story">
        <div class="story-circle">🇮🇳</div>
        <span>India</span>
    </div>

    <div class="story">
        <div class="story-circle">🏛️</div>
        <span>Parliament</span>
    </div>

    <div class="story">
        <div class="story-circle">🔴</div>
        <span>Live</span>
    </div>

    <div class="story">
        <div class="story-circle">🌎</div>
        <span>World</span>
    </div>

</div>

<!-- Categories -->
<div class="categories">
    <button class="active">All</button>
    <button>Trending</button>
    <button>India</button>
    <button>Government</button>
    <button>World</button>
</div>

<!-- LIVE NEWS WILL COME HERE -->
<div id="newsBox"></div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">

    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
        🏠
        <span>Home</span>
    </button>

    <button onclick="document.getElementById('newsBox').scrollIntoView({behavior:'smooth'})">
        📰
        <span>News</span>
    </button>

    <button>
        🔍
        <span>Search</span>
    </button>

    <button>
        🔔
        <span>Alerts</span>
    </button>

    <button>
        👤
        <span>Profile</span>
    </button>

</nav>

<script src="script.js"></script>

</body>
</html>
